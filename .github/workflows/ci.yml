name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    # The integration tests build ConvertX from source, so it's checked out next to this
    # repository, where the tests look for it.
    defaults:
      run:
        working-directory: convertx-sdk
    steps:
      - uses: actions/checkout@v7
        with:
          path: convertx-sdk
      - uses: actions/checkout@v7
        with:
          repository: fredobumma/ConvertX
          ref: feat/rest-api
          path: convertx-api
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: convertx-sdk/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: convertx-sdk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
